<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="plt-glyph-t">
  <title id="plt-glyph-t">Plotinium</title>
  <!-- The Plotinium mark ("Bohr P"): an electron shell around a dense nucleus, open at 1:30 where
       the one electron sits; the shell's stem makes it the P of Plotinium. 24-unit grid, fills
       only, edges on multiples of 1.5 units (whole pixels at 16, 32 and 48 px). Same drawing as
       ui/src/icons/atom-logo.ts. Light colours, dark ones under prefers-color-scheme: dark. -->
  <style>
    .plt-g-b{fill:var(--pl-logo-orbit-a,#5856D6)}.plt-g-c{fill:var(--pl-logo-core,#4F4DC9)}.plt-g-e{fill:var(--pl-logo-electron,#5856D6)}
    @media (prefers-color-scheme:dark){.plt-g-b{fill:var(--pl-logo-orbit-a,#B3B1FF)}.plt-g-c{fill:var(--pl-logo-core,#FFFFFF)}.plt-g-e{fill:var(--pl-logo-electron,#CFCEFF)}}
  </style>
  <path class="plt-g-b" fill="#5856D6" d="M4.5 9V21A1.5 1.5 0 0 0 7.5 21V9A1.5 1.5 0 0 0 4.5 9Z"/>
  <path class="plt-g-b" fill="#5856D6" d="M19.497 9.214A7.5 7.5 0 1 1 11.786 1.503A1.5 1.5 0 0 1 11.872 4.502A4.5 4.5 0 1 0 16.498 9.128A1.5 1.5 0 0 1 19.497 9.214Z"/>
  <circle class="plt-g-e" fill="#5856D6" cx="16.243" cy="4.757" r="2"/>
  <circle class="plt-g-c" fill="#4F4DC9" cx="12" cy="9" r="2.8"/>
</svg>
