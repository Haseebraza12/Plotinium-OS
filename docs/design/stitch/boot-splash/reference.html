<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotinium boot splash</title>
<!--
  Hand-built reference render (NOT a Stitch export). Stitch generation did not return a screen
  in this run; see notes.md and screen.json.
  Boot-path rules honoured (boot spec §5.6, SVC-10): no @keyframes, no CSS animation, no setTimeout or
  setInterval. Every effect is a CSS transition fired by a (simulated) boot event or by transitionend.
  ?replay  simulates a whole boot with requestAnimationFrame so the motion can be reviewed.
  ?motion=reduce  forces the reduced-motion path.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --pl-bg: #0B0D17;
    --pl-bg-2: #1A1440;
    --pl-text: rgba(255,255,255,.92);
    --pl-text-2: rgba(255,255,255,.85);
    --pl-text-muted: #8E8EA0;
    --pl-accent: #5E5CE6;
    --pl-accent-hi: #8B8AFF;
    --pl-accent-lav: #A5A4FF;
    --pl-hair: rgba(255,255,255,.10);
    --pl-font: "Inter", system-ui, sans-serif;
    --pl-mono: "JetBrains Mono", ui-monospace, monospace;
    --pl-text-sm: 13px; --pl-text-xs: 12px;
    --pl-space-3: 12px;
    --pl-boot-logo: 96px; --pl-boot-bar-w: 280px; --pl-boot-bar-h: 4px;

    --pl-motion-fast: 120ms; --pl-motion-med: 200ms; --pl-motion-slow: 320ms; --pl-motion-stage: 1200ms;
    --pl-motion-orbit: 560ms; --pl-motion-enter: 520ms;
    --pl-ease: cubic-bezier(.2,.8,.2,1);
    --pl-ease-in: cubic-bezier(.4,0,1,1);
    --pl-ease-out: cubic-bezier(0,0,.2,1);
    --pl-spring-soft: linear(0, 0.063, 0.225 4.5%, 0.648 10.5%, 0.877 15%, 0.967 18.5%, 1.021 22.6%, 1.035 26.3%, 1.031 30.4%, 1.008 41.5%, 0.998 51.6%, 1);
    --pl-spring: linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017 19.4%, 1.067, 1.099 24.3%, 1.108 26%, 1.103, 1.085 30.8%, 1.042 35.3%, 0.994 40.9%, 0.981 44.1%, 0.978, 0.983 50.9%, 1.001 61.3%, 1.004 68.5%, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --pl-motion-fast: 0ms; --pl-motion-med: 0ms; --pl-motion-slow: 0ms; --pl-motion-stage: 0ms; --pl-motion-orbit: 0ms; --pl-motion-enter: 0ms; }
  }
  :root[data-motion="reduce"] { --pl-motion-fast: 0ms; --pl-motion-med: 0ms; --pl-motion-slow: 0ms; --pl-motion-stage: 0ms; --pl-motion-orbit: 0ms; --pl-motion-enter: 0ms; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--pl-bg);
    color: var(--pl-text);
    font: var(--pl-text-sm)/1.45 var(--pl-font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- background: base field, three light blobs, faint orbit arcs ---------- */
  .field { position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(1100px 760px at 50% 46%, rgba(42,31,92,.95), rgba(26,20,64,.6) 45%, transparent 75%),
      linear-gradient(180deg, #0B0D17 0%, #110E28 55%, #0B0D17 100%); }
  .blob { position: fixed; border-radius: 50%; pointer-events: none; will-change: transform;
    transition: transform var(--pl-motion-stage) var(--pl-spring-soft), opacity var(--pl-motion-stage) var(--pl-ease); }
  .blob.b1 { width: 900px; height: 900px; left: -220px; top: -300px;
    background: radial-gradient(closest-side, rgba(94,92,230,.34), rgba(94,92,230,.12) 55%, transparent); }
  .blob.b2 { width: 1000px; height: 1000px; right: -320px; bottom: -420px;
    background: radial-gradient(closest-side, rgba(58,47,160,.42), rgba(58,47,160,.14) 55%, transparent); }
  .blob.b3 { width: 760px; height: 520px; left: 340px; bottom: -330px; opacity: var(--cyan, .5);
    background: radial-gradient(closest-side, rgba(90,200,250,.16), rgba(90,200,250,.05) 60%, transparent); }
  .arcs { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .9; }

  /* ---------- centre column ---------- */
  main { position: fixed; inset: 0; display: grid; place-items: center;
    transition: opacity var(--pl-motion-slow) var(--pl-ease-in), transform var(--pl-motion-slow) var(--pl-ease-in); }
  body.exit main { opacity: 0; transform: scale(1.04); }
  body.exit footer { opacity: 0; transform: translateY(8px); transition: transform var(--pl-motion-slow) var(--pl-ease-in), opacity var(--pl-motion-slow) var(--pl-ease-in); }
  .hint .swap { justify-items: start; }
  .col { width: min(480px, calc(100vw - 32px)); display: flex; flex-direction: column; align-items: center; gap: var(--pl-space-3); margin-top: -18px; }

  .logo { width: var(--pl-boot-logo); height: var(--pl-boot-logo); overflow: visible;
    transition: transform var(--pl-motion-enter) var(--pl-spring-soft); }
  @starting-style { .logo { transform: scale(.96); } }
  .logo .orbit { transform-box: view-box; transform-origin: 48px 48px;
    transform: rotate(calc(var(--tick, 0) * var(--k) * 1deg));
    transition: transform var(--pl-motion-orbit) var(--pl-spring-soft), opacity var(--pl-motion-enter) var(--pl-ease-out); }
  @starting-style { .logo .orbit { opacity: .7; } }
  .logo .bloom { transform-box: view-box; transform-origin: 48px 48px; opacity: .85;
    transition: opacity 640ms var(--pl-ease-out) 80ms, transform 640ms var(--pl-ease-out) 80ms; }
  @starting-style { .logo .bloom { opacity: 0; transform: scale(.6); } }
  .logo .nucleus { transform-box: view-box; transform-origin: 48px 48px;
    transition: transform 420ms var(--pl-ease); }
  .logo.flash .nucleus { transform: scale(1.12); transition-duration: 140ms; transition-timing-function: var(--pl-ease-out); }
  .logo.flash .bloom { opacity: 1; transition: opacity 140ms var(--pl-ease-out); }
  @media (prefers-reduced-motion: reduce) { .logo .orbit { transform: none; } }
  :root[data-motion="reduce"] .logo .orbit { transform: none; }

  .wordmark { font: 600 34px/1.1 var(--pl-font); letter-spacing: -.02em; color: #fff; margin-top: 10px;
    text-shadow: 0 0 24px rgba(139,138,255,.25);
    transition: transform 360ms var(--pl-spring-soft) 60ms; }
  @starting-style { .wordmark { transform: translateY(6px); } }
  .version { font-size: var(--pl-text-sm); color: var(--pl-text-muted); letter-spacing: .01em;
    transition: transform 360ms var(--pl-spring-soft) 100ms, opacity 360ms var(--pl-ease-out) 100ms; }
  @starting-style { .version { transform: translateY(6px); opacity: .001; } }

  /* ---------- progress bar ---------- */
  .bar { position: relative; width: var(--pl-boot-bar-w); height: var(--pl-boot-bar-h); margin-top: 22px;
    border-radius: 999px; background: rgba(255,255,255,.10);
    box-shadow: inset 0 0 0 .5px rgba(255,255,255,.06);
    transition: transform 360ms var(--pl-spring-soft) 140ms, opacity 360ms var(--pl-ease-out) 140ms; }
  @starting-style { .bar { transform: translateY(6px); opacity: .001; } }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p, 0) * 1%); overflow: hidden;
    border-radius: inherit; background: linear-gradient(90deg, var(--pl-accent) 0%, #6F6DF0 60%, var(--pl-accent-hi) 100%);
    box-shadow: 0 0 10px rgba(94,92,230,.55);
    transition: width var(--pl-motion-fast) var(--pl-ease); }
  .sheen { position: absolute; top: 0; bottom: 0; right: 0; width: 56px; opacity: .55;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95) 85%, rgba(255,255,255,.4));
    transition: transform 480ms var(--pl-ease), opacity 480ms var(--pl-ease); }
  .sweep .sheen { opacity: .95; transform: translateX(0); transition: transform 260ms var(--pl-ease-out), opacity 260ms var(--pl-ease-out); }
  .bar:not(.sweep) .sheen { transform: translateX(0); }
  .bar.pre .sheen { transform: translateX(-56px); opacity: 0; transition: none; }
  .glow { position: absolute; top: -6px; bottom: -6px; left: 0; width: calc(var(--p, 0) * 1%); border-radius: 999px; pointer-events: none;
    box-shadow: 0 0 18px 2px rgba(94,92,230,.55); opacity: .6;
    transition: width var(--pl-motion-fast) var(--pl-ease), opacity 400ms var(--pl-ease); }
  .sweep .glow { opacity: .9; transition: width var(--pl-motion-fast) var(--pl-ease), opacity 200ms var(--pl-ease); }
  .tip { position: absolute; top: 50%; left: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px 2px rgba(165,164,255,.9), 0 0 18px 4px rgba(94,92,230,.6);
    transform: translateX(calc(var(--p, 0) * var(--pl-boot-bar-w) / 100));
    transition: transform var(--pl-motion-fast) var(--pl-ease), opacity 200ms var(--pl-ease); }
  .bar[data-empty] .tip { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .sheen, .glow { opacity: 0 !important; } }
  :root[data-motion="reduce"] .sheen, :root[data-motion="reduce"] .glow { opacity: 0 !important; }

  /* ---------- status lines ---------- */
  .swap { position: relative; display: grid; justify-items: center; }
  .swap > span { grid-area: 1 / 1; white-space: nowrap;
    transition: transform 200ms var(--pl-spring-soft), opacity 200ms var(--pl-ease-out); }
  .swap > span.out { transform: translateY(-4px); opacity: 0; transition: transform 120ms var(--pl-ease-in), opacity 120ms var(--pl-ease-in); }
  .swap > span.in-start { transform: translateY(4px); opacity: 0; transition: none; }
  .step { margin-top: 10px; font-size: var(--pl-text-sm); color: var(--pl-text-2); font-feature-settings: "tnum";
    transition: transform 360ms var(--pl-spring-soft) 180ms, opacity 360ms var(--pl-ease-out) 180ms; }
  @starting-style { .step { transform: translateY(6px); opacity: .001; } }
  .count { font-size: var(--pl-text-xs); color: var(--pl-text-muted); font-feature-settings: "tnum"; margin-top: -4px;
    transition: transform 360ms var(--pl-spring-soft) 200ms, opacity 360ms var(--pl-ease-out) 200ms; }
  @starting-style { .count { transform: translateY(6px); opacity: .001; } }
  .count .num { display: inline-grid; justify-items: center; min-width: .62em; overflow: hidden; height: 1.45em; vertical-align: top; }
  .count .num > span.out { transform: translateY(-6px); }
  .count .num > span.in-start { transform: translateY(6px); }

  /* ---------- hint chips ---------- */
  footer { position: fixed; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; gap: 12px;
    transition: transform 320ms var(--pl-ease-out) 240ms, opacity 320ms var(--pl-ease-out) 240ms; }
  @starting-style { footer { transform: translateY(8px); opacity: 0; } }
  .hint { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 5px;
    font: 500 var(--pl-text-xs) var(--pl-font); color: var(--pl-text-muted); cursor: pointer;
    border-radius: 9px; border: 1px solid var(--pl-hair);
    background: rgba(255,255,255,.06); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.25);
    transition: background-color var(--pl-motion-fast) var(--pl-ease), color var(--pl-motion-fast) var(--pl-ease), opacity var(--pl-motion-med) var(--pl-ease); }
  .hint::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; border: 1px solid var(--pl-accent); opacity: 0;
    transition: opacity 160ms var(--pl-ease); pointer-events: none; }
  .hint:hover { background: rgba(255,255,255,.10); color: var(--pl-text); }
  .hint:focus-visible { outline: 3px solid rgba(94,92,230,.55); outline-offset: 2px; }
  .hint[aria-pressed="true"]::after { opacity: 1; }
  .hint[aria-disabled="true"] { opacity: .4; cursor: default; }
  .hint[aria-disabled="true"]:hover { background: rgba(255,255,255,.06); color: var(--pl-text-muted); }
  kbd { font: 600 11px var(--pl-font); color: var(--pl-text); min-width: 22px; height: 20px; padding: 0 6px;
    display: inline-grid; place-items: center; border-radius: 5px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 0 rgba(0,0,0,.55);
    transition: transform 160ms var(--pl-spring); }
  .hint.down kbd { transform: translateY(1px) scale(.94); transition: transform 80ms var(--pl-ease-out); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .replay { position: fixed; top: 16px; right: 16px; font: 500 12px var(--pl-font); color: var(--pl-text-muted);
    background: rgba(255,255,255,.06); border: 1px solid var(--pl-hair); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: none; }
  .replay.show { display: block; }

  @media (forced-colors: active) {
    .fill { background: Highlight; box-shadow: none; } .bar { background: Canvas; border: 1px solid CanvasText; }
    .sheen, .glow, .tip, .blob, .arcs { display: none; }
  }
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>
<svg class="arcs" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1">
    <path d="M -120 760 A 900 360 -12 0 1 1100 120"/>
    <path d="M 260 980 A 820 300 18 0 1 1560 520"/>
    <path d="M 1500 90 A 700 260 -28 0 0 520 -60"/>
    <path d="M -80 300 A 640 220 8 0 0 700 960"/>
  </g>
  <circle cx="1100" cy="120" r="2" fill="#A5A4FF" fill-opacity=".35"/>
</svg>

<main aria-labelledby="boot-title">
  <h1 id="boot-title" class="sr">Plotinium is starting</h1>
  <div class="col">
    <svg class="logo" id="logo" viewBox="0 0 96 96" role="img" aria-label="Plotinium logo" style="--tick:0">
      <defs>
        <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5E5CE6"/><stop offset="1" stop-color="#A5A4FF"/>
        </linearGradient>
        <radialGradient id="bl">
          <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
          <stop offset=".22" stop-color="#C9C8FF" stop-opacity=".75"/>
          <stop offset=".55" stop-color="#5E5CE6" stop-opacity=".28"/>
          <stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="bloom" cx="48" cy="48" r="34" fill="url(#bl)"/>
      <g class="orbit" style="--k:9" fill="none" stroke="url(#og)" stroke-width="1.5" stroke-linecap="round">
        <ellipse cx="48" cy="48" rx="43" ry="15.5"/>
        <circle cx="91" cy="48" r="2.4" fill="#fff" stroke="none"/>
        <circle cx="91" cy="48" r="5" fill="#A5A4FF" fill-opacity=".35" stroke="none"/>
      </g>
      <g class="orbit" style="--k:-6" fill="none" stroke="url(#og)" stroke-width="1.5" stroke-opacity=".9">
        <ellipse cx="48" cy="48" rx="43" ry="15.5" transform="rotate(60 48 48)"/>
      </g>
      <g class="orbit" style="--k:4" fill="none" stroke="url(#og)" stroke-width="1.5" stroke-opacity=".8">
        <ellipse cx="48" cy="48" rx="43" ry="15.5" transform="rotate(120 48 48)"/>
      </g>
      <g class="nucleus">
        <circle cx="48" cy="48" r="7.5" fill="#fff" fill-opacity=".25"/>
        <circle cx="48" cy="48" r="5" fill="#fff"/>
      </g>
    </svg>

    <div class="wordmark" role="img" aria-label="Plotinium">Plotinium</div>
    <div class="version">version 0.3.0 · build a1f93c2</div>

    <div class="bar" id="bar" role="progressbar" aria-label="Boot progress" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="62" aria-valuetext="Starting vfs, 7 of 9" aria-describedby="step" style="--p:62">
      <div class="glow" aria-hidden="true"></div>
      <div class="fill"><div class="sheen" aria-hidden="true"></div></div>
      <div class="tip" aria-hidden="true"></div>
    </div>

    <div class="step swap" id="step"><span>vfs: mounting / (12,408 inodes)</span></div>
    <div class="count" id="count">Service start · <span class="num swap" id="num"><span>7</span></span> of 9</div>
  </div>
</main>

<footer aria-label="Start-up keys">
  <button class="hint" id="hint-esc" type="button" aria-keyshortcuts="Escape"><kbd>Esc</kbd><span>Boot menu</span></button>
  <button class="hint" id="hint-v" type="button" aria-keyshortcuts="V" aria-pressed="false"><kbd>V</kbd><span class="swap" id="v-label"><span>Verbose log</span></span></button>
</footer>

<div class="sr" role="status" aria-live="polite" id="live"></div>
<button class="replay" id="replay" type="button">Replay boot</button>

<script>
  // Reference only. In the product these functions are called by boot-ui when the kernel posts
  // events; here ?replay feeds them simulated events with requestAnimationFrame (never a timer).
  const q = new URLSearchParams(location.search);
  if (q.get('motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
  const $ = id => document.getElementById(id);
  const logo = $('logo'), bar = $('bar'), live = $('live');
  const blobs = [...document.querySelectorAll('.blob')];

  // Blob presets per boot stage 1..6 (translate x, y px, scale). Moved once per stage change.
  const STAGES = [null,
    [[0,0,1],[0,0,1],[0,0,1],.35],
    [[40,20,1.03],[-30,-10,1.02],[-40,0,1],.45],
    [[90,40,1.06],[-60,-30,1.04],[-90,-10,1.05],.6],
    [[140,70,1.08],[-100,-50,1.06],[-140,-20,1.1],.8],
    [[180,110,1.1],[-140,-80,1.08],[-100,-40,1.12],.9],
    [[220,140,1.12],[-170,-100,1.1],[-60,-60,1.14],1]];
  function setStage(n) {
    const s = STAGES[n];
    blobs.forEach((b, i) => b.style.transform = `translate(${s[i][0]}px, ${s[i][1]}px) scale(${s[i][2]})`);
    document.documentElement.style.setProperty('--cyan', s[3]);
  }

  let tick = 0;
  function bootEvent() { logo.style.setProperty('--tick', ++tick); }

  function swapText(box, text) {
    const cur = box.querySelector('span:not(.out)');
    if (cur && cur.textContent === text) return;
    const now = performance.now();
    if (!cur || now - (box._t || 0) < 120) { if (cur) cur.textContent = text; else box.append(Object.assign(document.createElement('span'), { textContent: text })); box._t = now; return; }
    box._t = now;
    box.querySelectorAll('span.out').forEach(s => s.remove());
    cur.classList.add('out');
    cur.addEventListener('transitionend', () => cur.remove(), { once: true });
    const n = Object.assign(document.createElement('span'), { textContent: text, className: 'in-start' });
    box.append(n);
    requestAnimationFrame(() => requestAnimationFrame(() => n.classList.remove('in-start')));
  }

  let lastAnnounce = 0;
  function announce(text) { const now = performance.now(); if (now - lastAnnounce >= 750) { live.textContent = text; lastAnnounce = now; } }

  function setProgress(p, valuetext) {
    bar.style.setProperty('--p', p);
    bar.setAttribute('aria-valuenow', Math.round(p));
    bar.setAttribute('aria-valuetext', valuetext);
    if (p > 0) bar.removeAttribute('data-empty'); else bar.setAttribute('data-empty', '');
    bar.classList.remove('pre');
    bar.classList.add('sweep');
  }
  bar.addEventListener('transitionend', e => { if (e.target.classList.contains('sheen') && e.propertyName === 'opacity') bar.classList.remove('sweep'); });

  function serviceDone(n) {
    swapText($('num'), String(n));
    logo.classList.add('flash');
  }
  logo.addEventListener('transitionend', e => { if (e.propertyName === 'transform' && logo.classList.contains('flash')) logo.classList.remove('flash'); });

  // Keys: Esc and V are listened for from the first line of boot-ui (buffered in the product).
  const hintEsc = $('hint-esc'), hintV = $('hint-v');
  let verbose = false, decided = false;
  function press(el, on) { el.classList.toggle('down', on); }
  addEventListener('keydown', e => {
    if (e.key === 'Escape') press(hintEsc, true);
    if (e.key === 'v' || e.key === 'V') { press(hintV, true); if (!e.repeat) toggleVerbose(); }
  });
  addEventListener('keyup', e => {
    if (e.key === 'Escape') press(hintEsc, false);
    if (e.key === 'v' || e.key === 'V') press(hintV, false);
  });
  function toggleVerbose() {
    verbose = !verbose;
    hintV.setAttribute('aria-pressed', verbose);
    swapText($('v-label'), verbose ? 'Hide log' : 'Verbose log');
  }
  hintV.addEventListener('click', toggleVerbose);
  function decideProfile() {
    decided = true;
    hintEsc.setAttribute('aria-disabled', 'true');
    hintEsc.title = 'Boot menu: run reboot --menu';
  }

  // ---------- simulated boot (review aid) ----------
  // [t seconds, progress %, stage, label, services done in A (of 9) or null, announce]
  const EVENTS = [
    [0.00, 0,  1, 'checking system', null, 'Checking system'],
    [0.10, 6,  2, 'Loading kernel · 38 of 104 KB', null],
    [0.22, 14, 2, 'Loading kernel · 104 of 104 KB', null, 'Loading kernel'],
    [0.30, 18, 3, 'kernel: process table ready · pid 1 = init', 1, 'Kernel ready'],
    [0.42, 24, 4, 'svc: 18 manifests · 30 edges · acyclic · 7 levels', null, 'Starting services'],
    [0.55, 31, 4, 'sched: priority heap + RR · quanta 5/10/20 ms', 2],
    [0.75, 40, 4, 'storage: opened plotinium v7 (IndexedDB) · epoch 38', 3],
    [0.90, 47, 4, 'mm: budget 256 MB · swap tiers: opfs, server', 4],
    [1.05, 53, 4, 'wm: compositor ready · 3 layers', 5],
    [1.30, 62, 4, 'vfs: mounting / (12,408 inodes)', 7, 'Starting vfs, 7 of 9'],
    [1.60, 72, 5, 'login: session restored for uid 1001 (student)', 8, 'Signing in'],
    [1.90, 86, 6, 'session: restoring 4 windows', null, 'Restoring session'],
    [2.20, 100, 6, 'desktop: interactive · boot 0.73 s', 9, 'Desktop ready'],
  ];
  function replay() {
    $('replay').classList.remove('show');
    document.body.classList.remove('exit');
    tick = 0; logo.style.setProperty('--tick', 0);
    bar.style.setProperty('--p', 0); bar.setAttribute('data-empty', ''); bar.classList.add('pre');
    swapText($('step'), 'checking system'); $('num').innerHTML = '<span>0</span>';
    hintEsc.removeAttribute('aria-disabled'); decided = false;
    setStage(1);
    let i = 0; const start = performance.now() + 400;
    (function frame(now) {
      const t = (now - start) / 1000;
      while (i < EVENTS.length && t >= EVENTS[i][0]) {
        const [, p, stage, label, done, say] = EVENTS[i];
        setStage(stage); setProgress(p, say || label); swapText($('step'), label); bootEvent();
        if (done != null) serviceDone(done);
        if (stage >= 3 && !decided) decideProfile();
        if (say) announce(say);
        i++;
      }
      if (i < EVENTS.length) requestAnimationFrame(frame);
      else requestAnimationFrame(() => requestAnimationFrame(() => {
        const m = document.querySelector('main');
        m.addEventListener('transitionend', () => $('replay').classList.add('show'), { once: true });
        document.body.classList.add('exit');
      }));
    })(performance.now());
  }
  $('replay').addEventListener('click', replay);
  hintEsc.addEventListener('click', () => { if (!decided) announce('Boot menu will open'); });

  // Static review state = the Stitch prompt: stage 4, P = 62 %, 7 of 9, orbits advanced 7 ticks.
  if (q.has('replay')) replay();
  else { setStage(4); logo.style.setProperty('--tick', 7); tick = 7; bar.classList.remove('sweep'); live.textContent = 'Starting vfs, 7 of 9'; }
</script>
</body>
</html>
