<!doctype html><html><head><meta charset="utf-8"><script src="./wasm_exec.js"></script></head><body><script type="module">
import { rng } from './dsa.js';
const R = {};
const t0 = performance.now(); const go = new Go(); const { instance } = await WebAssembly.instantiateStreaming(fetch('./goheap.wasm'), go.importObject); go.run(instance); R.instantiate_ms = +(performance.now() - t0).toFixed(1);
{ let x = 0; for (let i = 0; i < 1e5; i++) x += goNoop(i); const N = 1e6; const t = performance.now(); for (let i = 0; i < N; i++) x += goNoop(i); R.go_noop_call_ns = +((performance.now() - t) * 1e6 / N).toFixed(1); }
R.heap = {};
for (const n of [256, 10000, 100000]) { const OPS = 100000; const rnd = rng(42); goClear(); let seq = 0; for (let i = 0; i < n; i++) goPush(i, (rnd() * 40) | 0, seq++);
  for (let i = 0; i < 20000; i++) { const p = goPop(); goPush(p, (rnd() * 40) | 0, seq++); }
  const t = performance.now(); for (let i = 0; i < OPS; i++) { const p = goPop(); goPush(p, (rnd() * 40) | 0, seq++); } R.heap[n] = +((performance.now() - t) * 1e6 / OPS).toFixed(1); }
window.__R = R; window.__done = true;
</script></body></html>
