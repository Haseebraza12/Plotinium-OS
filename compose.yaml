# compose.yaml: Plotinium (C14). The ONLY file an examiner needs:
#   git clone <repo>; cd plotinium; docker compose up -d --wait; open http://localhost:4717
# Spec: specs/14-devops/deployment-and-ci.md §3.1.1 (OPS-01, OPS-02, OPS-03, OPS-05, OPS-09).
#
# No credential appears in this file: the database passwords are generated at first start into
# the `dbsecrets` volume (ops/db/entrypoint.sh) and the user passwords are generated by the seed
# and printed once in `docker compose logs app` (C10, SRV-20).
#
# Images: each service has both `image` and `build`. Compose uses the image if it is present and
# builds it from this repository otherwise. The release pipeline's pin PR replaces the three
# `:0.1.0` tags with `@sha256:` digests of the public GHCR images (§3.4) and the real <org>.
# `docker compose up -d --wait --build` always builds the working tree (developers, CI e2e).
name: plotinium

x-logging: &logging
  driver: local
  options: { max-size: '10m', max-file: '5' }

services:
  db:
    image: ghcr.io/plotinium-org/plotinium-db:0.1.0
    build: { context: ., target: db }
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - idle_in_transaction_session_timeout=10s
      - -c
      - pg_stat_statements.track=top
      - -c
      - auto_explain.log_min_duration=10ms
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - lc_messages=C
      - -c
      - timezone=UTC
    environment:
      POSTGRES_USER: plotinium_owner # bootstrap superuser; owns every object (database.md §3.2)
      POSTGRES_DB: plotinium
      POSTGRES_INITDB_ARGS: '--locale-provider=builtin --builtin-locale=C.UTF-8'
      # POSTGRES_PASSWORD_FILE is exported by the image's wrapper after it generates the secret.
    volumes:
      - pgdata:/var/lib/postgresql # PG18 layout: PGDATA=/var/lib/postgresql/18/docker
      - dbsecrets:/run/plotinium # generated owner_password and app_password
    networks: [backplane]
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U plotinium_owner -d plotinium']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging

  app:
    image: ghcr.io/plotinium-org/plotinium-app:0.1.0
    build:
      context: .
      target: app
      # The build identity (UI-008): `pnpm start` exports these (tools/build-id.ts: the git short
      # SHA of a clean checkout, else a content hash of the source tree). Left empty, the
      # Dockerfile's `buildid` stage computes the same values itself.
      args: &build-id
        BUILD_SHA: ${BUILD_SHA:-}
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_DATE: ${BUILD_DATE:-}
    environment:
      PLOTINIUM_ENV: ${PLOTINIUM_ENV:-local} # CI e2e exports ci (replay only)
      PLOTINIUM_PORT: ${PLOTINIUM_PORT:-4717} # builds APP_ORIGIN http://localhost:<port>
      DATABASE_URL: postgres://plotinium_app@db:5432/plotinium
      DATABASE_PASSWORD_FILE: /run/plotinium/app_password
      OWNER_DATABASE_URL: postgres://plotinium_owner@db:5432/plotinium # entrypoint only (dbmate, seed)
      OWNER_PASSWORD_FILE: /run/plotinium/owner_password
      TRUST_PROXY_CIDRS: 172.30.47.0/24
      BLOB_DIR: /var/lib/plotinium/blobs
      FAULT_INJECTION: '1' # local/defence profile only (C7, OPS-09); compose.prod.yaml forces 0
      LEASE_TTL_MS: ${LEASE_TTL_MS:-15000} # demo lease profile (C6); heartbeat TTL/3
      LLM_MODE: ${LLM_MODE:-live} # no key here: the gateway reports no-key and AI degrades
      AI: ${AI:-1} # AI=0 for the litmus build
      PLOTINIUM_SEED_PROFILE: ${PLOTINIUM_SEED_PROFILE:-bench10k} # first start: DB-05 data set (none to skip)
    volumes:
      - dbsecrets:/run/plotinium:ro
      - blobs:/var/lib/plotinium/blobs
    networks: [edge, backplane]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 120s # migrations + seed
    stop_grace_period: 15s # SHUTDOWN_GRACE_MS 10 s + margin (backend-api §3.17)
    logging: *logging

  web:
    image: ghcr.io/plotinium-org/plotinium-web:0.1.0
    build:
      context: .
      target: web
      args: *build-id # the same identity as the app (UI-008)
    environment:
      SITE_ADDRESS: ':4717' # plain HTTP on localhost (a secure context)
    ports:
      - '127.0.0.1:${PLOTINIUM_PORT:-4717}:4717' # loopback only: never reachable from the LAN (SEC-20)
    volumes:
      - caddy_data:/data # certificates survive container recreation
      - caddy_config:/config
    networks:
      edge: { ipv4_address: 172.30.47.10 }
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      # Caddy answers, and the baked web root is the real shell (inlined boot screen), not the
      # ops/web-placeholder page.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8081/health >/dev/null && wget -qO- http://127.0.0.1:8081/shell | grep -q data-testid=.boot-screen',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging

networks:
  edge:
    ipam: { config: [{ subnet: 172.30.47.0/24 }] } # TRUST_PROXY_CIDRS (backend-api §3.4)
  backplane:
    internal: true # db unreachable from the host and the internet

volumes:
  pgdata: {}
  dbsecrets: {}
  blobs: {}
  caddy_data: {}
  caddy_config: {}
